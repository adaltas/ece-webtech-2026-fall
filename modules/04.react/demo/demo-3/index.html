<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Click Counter - React with JSX</title>
    <!-- Babel transpiles the JSX live in the browser. Demonstration only:
         real projects transpile ahead of time with a build tool like Vite. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <h1>React Click Counter (JSX)</h1>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, { useState } from 'https://esm.sh/react@19'
      import { createRoot } from 'https://esm.sh/react-dom@19/client'

      // Same component as demo-2, written in JSX
      const ClickCounter = () => {
        const [count, setCount] = useState(0)
        return (
          <>
            <button onClick={() => setCount(count + 1)}>Click me</button>
            <span> {count} times</span>
          </>
        )
      }

      createRoot(document.getElementById('root')).render(<ClickCounter />)
    </script>
  </body>
</html>
